<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dennys Ferreira</title>
    <style>
        *{
          margin:0;
          padding:0;
          box-sizing:border-box;
          font-family: Arial, Helvetica, sans-serif;
        }
    
        body{
          background: linear-gradient(135deg, #0b6623, #1e8f3f);
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
        }
    
        nav{
          background:#ffffff;
          padding:20px 40px;
          border-radius:20px;
          box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }
    
        .menu{
          display:flex;
          gap:25px;
          list-style:none;
          align-items:center;
        }
    
        .menu li a{
          text-decoration:none;
          color:#0b6623;
          font-size:18px;
          font-weight:bold;
          padding:12px 20px;
          border-radius:10px;
          transition:0.3s;
          position:relative;
        }
    
        .menu li a:hover{
          background:#ffcc00;
          color:#000;
          transform:translateY(-3px);
        }
    
        .logo{
          font-size:26px;
          color:#0b6623;
          margin-right:20px;
        }
    
        /* Bola de futebol decorativa */
        .ball{
          width:45px;
          height:45px;
          background:#fff;
          border-radius:50%;
          border:3px solid #000;
          position:relative;
          overflow:hidden;
        }
    
        .ball::before,
        .ball::after{
          content:'⚽';
          position:absolute;
          font-size:28px;
        }
    
        .ball::before{
          top:4px;
          left:6px;
        }
    
        .ball::after{
          display:none;
        }
    
        /* Responsivo */
        @media(max-width:768px){
          nav{
            width:90%;
          }
    
          .menu{
            flex-direction:column;
          }
    
          .logo{
            margin-bottom:10px;
            margin-right:0;
          }
        }
      </style>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <ul class="menu">
                  <li class="logo">🏆 Copa 2026</li>
                  <li><a href="#">Início</a></li>
                  <li><a href="#">Seleções</a></li>
                  <li><a href="#">Jogos</a></li>
                  <li><a href="#">Tabela</a></li>
                  <li><a href="#">Notícias</a></li>
                  <li><div class="ball"></div></li>
                </ul>
              </nav>
        </header>
        <section>

        </section>
        <footer>
            <p>Dennys Ferreira</p>
        </footer>
    </div>
</body>
</html>
